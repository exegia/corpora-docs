# A release PR landed on main: tag it, then open the next release branch

#

# Nothing is re-tested here — the exact tree being released already passed

# `guard` and `check` on the release PR

#

# There is no deploy job. The site is built and published by the Mintlify

# GitHub App, which watches main directly; a deploy step here would either

# double-publish or race it

#

# The tag `make tag-release` pushes is currently the end of the line — it marks

# the release and nothing is triggered by it. It is still created with the

# automation App's token rather than GITHUB_TOKEN, because events raised by

# GITHUB_TOKEN do not start workflow runs: anything later hung off `push: tags`

# would go silently dead, and that failure is invisible until someone notices

# a release that never shipped

#

# The dispatch is the bootstrap: it opens a release branch without a preceding

# release, which is how the first one (and any manual re-cut) gets created

name: Release

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: Bump for the next release branch
        default: minor
        type: choice
        options: [ major, minor, patch ]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: release
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      # Full history: `gh release --generate-notes` needs the preceding tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Tag and release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: make tag-release

      - name: Delete the release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: make delete-branch

  next-release:
    name: next-release
    needs: [ release ]
    # `release` is skipped on a manual dispatch, which is exactly the bootstrap
    # case — so run whenever it did not actually fail.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      # Full history and tags: `make next-version` reads the newest vX.Y.Z tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      # No toolchain setup: `make release-branch` writes VERSION and pushes.
      # There is no lockfile to re-resolve in a docs repo.
      - name: Open the next release branch
        env:
          BUMP: ${{ inputs.bump || 'minor' }}
        run: |
          git config user.name  "corpora-automation[bot]"
          git config user.email "corpora-automation[bot]@users.noreply.github.com"
          make release-branch
