# Everything that runs *before* a merge

#

# <type>/<slug>  ->  release/vX.Y.Z    guard + check + AI review

# release/vX.Y.Z ->  main              guard + check + package artifact

#

# Draft PRs only get the guard. The full suite starts at `ready_for_review`

# and re-runs on every push after that

name: PR

on:
  pull_request:
    types: [ opened, reopened, ready_for_review, synchronize ]
    branches:
      - main
      - "release/v*"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Passed as environment, never interpolated into the shell: a PR title is
      # attacker-controlled text.
      #
      # `event.pull_request.base.ref`, NOT `github.base_ref`: when a PR is part
      # of a GitHub stack, `github.base_ref` reports the stack's ultimate base
      # rather than the PR's own parent. This repo's model is inherently a
      # stack (<type>/<slug> -> release/vX.Y.Z -> main), so on every stacked
      # feature PR `github.base_ref` reads 'main' and the guard rejects it for
      # not being a release branch. The payload's PR object is authoritative.
      - name: Check base, branch name and title
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: make pr-guard

  check:
    name: check
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not `./.github/actions/setup`: that provisions uv against uv.lock and
      # .python-version, which belong to the packaged repo this workflow was
      # copied from. A docs repo has no lockfile — `make ci` is a stdlib
      # interpreter plus the one dependency the section scripts import, pinned
      # the same way section-request.yml pins it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pyyaml

      - run: make ci

# There is no `package` job. The repo publishes a documentation site through

# Mintlify's own build, not an artifact — the release PR's gates are the guard

# and the check, and the deploy happens after the merge, outside Actions

  review:
    name: review
    # See the guard job for why this is not `github.base_ref`.
    if: ${{ !github.event.pull_request.draft && startsWith(github.event.pull_request.base.ref, 'release/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # the review is posted through the issue-comments API
      actions: write # lets the review read this PR's CI results
      id-token: write
    env:
      # The `secrets` context cannot be referenced from an `if:` — GitHub rejects
      # the whole file with "Unrecognized named-value: 'secrets'". Mapping it to a
      # job-level env var makes it reachable from a step-level `if:`. Only
      # emptiness is ever tested; the value is never printed.
      CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A permanently-red check that means "unconfigured" is worse than no
      # check — it trains everyone to merge past red. Skip loudly instead.
      - name: Note that review is unconfigured
        if: ${{ env.CLAUDE_TOKEN == '' }}
        run: |
          {
            echo "### Review skipped"
            echo
            echo "\`CLAUDE_CODE_OAUTH_TOKEN\` is not set on this repository."
            echo "Add it under **Settings → Secrets and variables → Actions**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Light AI review
        if: ${{ env.CLAUDE_TOKEN != '' }}
        uses: anthropics/claude-code-action@bd4488507006939d8b3b7f098a2231b36e22f8c1 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          allowed_bots: "*"
