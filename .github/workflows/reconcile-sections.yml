# Read-only drift check on the sections registry.
#
# Deliberately never writes: a red job here means an activation step was left
# undone, and the fix belongs in a reviewed PR (activate-section.yml) rather
# than in a silent push to main.
#
# Checks, for every `active` section:
#   1. the section YAML is well-formed and its slug/repo are unique
#   2. the submodule exists at content/<slug>
#   3. docs.json actually carries content/<slug>/… navigation entries
#
# Check 3 exists because 1 and 2 can both pass while the section is invisible:
# a submodule with no nav entries ships content nobody can navigate to.

name: Reconcile sections registry

on:
  push:
    branches:
      - main
    paths:
      - "sections/**"
      - "docs.json"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    name: Check sections registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install --disable-pip-version-check pyyaml

      - name: Validate registry and activation state
        # The report has to reach the step summary whether or not the check
        # passes, so the failure is captured rather than allowed to abort the
        # step (GitHub runs `run:` blocks under `bash -e`).
        run: |
          status=0
          python3 .github/scripts/validate_sections.py \
            --check-activation --output report.md || status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
